
name: Bandit Dev Updates

on:
  push:
    branches:
      - main

jobs:
  telegram-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Announce new commit
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import html
          import urllib.request

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          commit = event.get("head_commit") or {}
          raw_message = commit.get("message") or "New update"
          description = html.escape(raw_message[:1200])
          author = html.escape(os.environ["ACTOR"])
          branch = html.escape(os.environ["BRANCH"])
          url = event.get("compare") or commit.get("url", "")
          count = len(event.get("commits", []))

          message = (
              "🚀 <b>BANDIT JUST GOT AN UPGRADE!</b>\n\n"
              "Fresh code has landed. 🦝\n\n"
              f"🔧 <b>What's new?</b>\n{description}\n\n"
              f"👨‍💻 Contributor: {author}\n"
              f"🌿 Branch: {branch}\n"
              f"📦 Commits: {count}\n\n"
              "⚡ Every commit brings Bandit closer to life."
          )

          if url:
              safe_url = html.escape(url, quote=True)
              message += (
                  f'\n\n🔗 <a href="{safe_url}">'
                  "Explore the changes</a>"
              )

          payload = json.dumps({
              "chat_id": os.environ["CHAT_ID"],
              "message_thread_id": int(os.environ["TOPIC_ID"]),
              "text": message,
              "parse_mode": "HTML",
              "link_preview_options": {"is_disabled": True}
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.telegram.org/bot"
              + os.environ["BOT_TOKEN"]
              + "/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
              if not result.get("ok"):
                  raise RuntimeError("Telegram rejected the message")
              print("Bandit notification sent successfully!")
          PY
